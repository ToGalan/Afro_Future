[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Prevent sharp from attempting native libvips compilation in CI
  SHARP_IGNORE_GLOBAL_LIBVIPS = "1"
  npm_config_sharp_ignore_global_libvips = "true"

# SPA routing — redirect all paths to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
